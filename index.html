<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Server list</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%235b8c3a'/><rect y='5' width='16' height='11' fill='%238a5a37'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14181a; --panel:#1c2225; --panel-2:#232b2e; --line:#2e393d;
  --text:#e8eee9; --muted:#8c9a96;
  --grass:#6fae45; --grass-d:#4a7a2e; --dirt:#8a5a37; --dirt-d:#5e3d25;
  --online:#7ddc5a; --offline:#e5604d; --stale:#e7b84a;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font:400 15px/1.5 Figtree,system-ui,sans-serif;
  background-image:
    linear-gradient(var(--bg) 0, transparent 220px),
    linear-gradient(90deg, #ffffff06 1px, transparent 1px),
    linear-gradient(#ffffff06 1px, transparent 1px);
  background-size:auto,32px 32px,32px 32px;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);
}
.wrap{max-width:1040px;margin:0 auto;padding:40px 20px 56px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
h1{font:700 34px/1 "Pixelify Sans",monospace;letter-spacing:.5px}
.sub{color:var(--muted);margin-top:8px}
.sync{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
button{font:inherit;color:inherit;cursor:pointer}
.refresh{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 14px;transition:background .15s,border-color .15s}
.refresh:hover{background:var(--panel-2);border-color:var(--grass-d)}
.refresh:focus-visible,.srv:focus-visible,.search:focus-visible{outline:2px solid var(--grass);outline-offset:2px}
.refresh.spin svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.layout{display:grid;grid-template-columns:340px 1fr;gap:20px;align-items:start}
@media(max-width:820px){.layout{grid-template-columns:1fr}header{flex-direction:column;align-items:flex-start}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.panel-h{padding:12px 16px;border-bottom:1px solid var(--line);color:var(--muted);font-size:13px;display:flex;justify-content:space-between}

.srv{
  display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;
  padding:14px 16px;background:none;border:0;border-bottom:1px solid var(--line);border-left:3px solid transparent;
  transition:background .12s;
}
.srv:last-child{border-bottom:0}
.srv:hover{background:var(--panel-2)}
.srv[aria-selected="true"]{background:var(--panel-2);border-left-color:var(--grass)}
.icon{
  width:48px;height:48px;border-radius:4px;image-rendering:pixelated;
  background:
    linear-gradient(var(--grass) 0 38%, var(--grass-d) 38% 46%, var(--dirt) 46%);
  box-shadow:inset 0 0 0 2px #0003;
}
.icon{position:relative;overflow:hidden}
.icon img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;image-rendering:auto}
.icon.off{filter:grayscale(1) brightness(.6)}
.srv b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srv small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font:700 15px "Pixelify Sans",monospace;color:var(--muted);text-align:right}
.dot{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--offline);margin-right:6px}
.dot.online{background:var(--online);box-shadow:0 0 8px #7ddc5a88}
.dot.stale{background:var(--stale)}

.detail{padding:0}
.banner{
  height:96px;position:relative;
  background:
    linear-gradient(var(--grass) 0 34%, var(--grass-d) 34% 42%, var(--dirt) 42%);
}
.banner img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.banner.has-img::after{display:none}
.banner::after{content:"";position:absolute;inset:0;
  background-image:linear-gradient(90deg,#0000001f 2px,transparent 2px),linear-gradient(#0000001f 2px,transparent 2px);
  background-size:24px 24px}
.d-body{padding:0 24px 24px}
.d-head{display:flex;gap:16px;align-items:flex-end;margin-top:-34px;position:relative;z-index:1}
.d-head .icon{width:72px;height:72px;border:3px solid var(--panel);border-radius:6px}
.d-head h2{font:700 26px/1.15 "Pixelify Sans",monospace;margin-bottom:4px}
.status{font-size:14px;display:inline-flex;align-items:center}
.desc{margin:18px 0 22px;max-width:60ch;color:#c5d0cb}
.addr{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px 10px 10px 14px;margin-bottom:12px}
.addr span{display:block;color:var(--muted);font-size:13px}
.addr code{font:500 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
.copy{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 14px;flex:none;transition:border-color .15s}
.copy:hover{border-color:var(--grass-d)}
.copy:focus-visible{outline:2px solid var(--grass);outline-offset:2px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.stat span{display:block;color:var(--muted);font-size:13px}
.stat strong{font:700 22px "Pixelify Sans",monospace}
h3{font:500 16px "Pixelify Sans",monospace;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.search{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px;color:var(--text);font:inherit;font-size:13px;width:180px}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;list-style:none;padding:0}
.players li{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0}
.players li span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{color:var(--muted);padding:20px;border:1px dashed var(--line);border-radius:6px;text-align:center}
.msg{padding:28px 20px;color:var(--muted);text-align:center}
.msg b{display:block;color:var(--text);margin-bottom:4px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Server list</h1>
      <p class="sub">Live status of your Multicraft servers.</p>
    </div>
    <div class="sync">
      <span id="updated">Loading…</span>
      <button class="refresh" id="refresh" type="button" aria-label="Refresh now">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>Refresh
      </button>
    </div>
  </header>

  <div class="layout">
    <section class="panel" aria-label="Servers">
      <div class="panel-h"><span>Servers</span><span id="total"></span></div>
      <div id="list" role="listbox" aria-label="Server list"></div>
    </section>
    <section class="panel detail" id="detail" aria-live="polite"></section>
  </div>
</div>

<script>
const API = "https://multicraft-api.multi-api.workers.dev/latest";
const REFRESH_MS = 15000;
const STALE_MS = 120000; // no report for 2 min = treat as unresponsive

let servers = [], selected = 0, filter = "", lastFetch = null, failed = false;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function normalize(data){
  if (Array.isArray(data)) return data;
  if (data && Array.isArray(data.servers)) return data.servers;
  return data && typeof data === "object" ? [data] : [];
}
function parsePlayers(s){
  if (Array.isArray(s.players)) return s.players.filter(Boolean);
  return String(s.players || "").split(",").map(p => p.trim()).filter(Boolean);
}
function state(s){
  if (String(s.status).toLowerCase() !== "online") return "offline";
  if (s.received && Date.now() - s.received > STALE_MS) return "stale";
  return "online";
}
const addrOf = s => String(s.address || s.adress || "").trim();
function imgUrl(v){
  const u = String(v || "").trim();
  if (/^https?:\/\//i.test(u)) return u;
  if (/^[\w-]+(\.[\w-]+)+(\/|$)/.test(u)) return "https://" + u;
  return "";
}
const bannerOf = s => imgUrl(s.banner);
function iconHtml(s, st){
  const u = imgUrl(s.icon);
  return `<div class="icon ${st === "online" ? "" : "off"}">${u ? `<img src="${esc(u)}" alt="" onerror="this.remove()">` : ""}</div>`;
}
const LABEL = {online:"Online", stale:"Not responding", offline:"Offline"};

function ago(ms){
  const s = Math.max(0, Math.round((Date.now() - ms) / 1000));
  if (s < 10) return "just now";
  if (s < 60) return s + " s ago";
  if (s < 3600) return Math.floor(s/60) + " min ago";
  if (s < 86400) return Math.floor(s/3600) + " h ago";
  return Math.floor(s/86400) + " d ago";
}

function renderList(){
  $("total").textContent = servers.length + (servers.length === 1 ? " server" : " servers");
  if (!servers.length){
    $("list").innerHTML = `<div class="msg"><b>${failed ? "Can't reach the API" : "No servers yet"}</b>${failed ? "Check your connection and try again." : "Nothing has reported in."}</div>`;
    return;
  }
  $("list").innerHTML = servers.map((s, i) => {
    const st = state(s);
    return `<button class="srv" role="option" type="button" data-i="${i}" aria-selected="${i === selected}">
      ${iconHtml(s, st)}
      <div><b>${esc(s.name || "Unnamed server")}</b><small>${esc(s.description || "No description")}</small></div>
      <div class="count" title="Players online">${st === "offline" ? "–" : (s.playercount ?? parsePlayers(s).length)}</div>
    </button>`;
  }).join("");
}

function renderDetail(){
  const el = $("detail");
  const s = servers[selected];
  if (!s){
    el.innerHTML = `<div class="msg"><b>${failed ? "Server data unavailable" : "Select a server"}</b>${failed ? "The status API didn't respond. It will retry automatically." : "Pick one from the list to see its details."}</div>`;
    return;
  }
  const st = state(s), all = parsePlayers(s);
  const q = filter.trim().toLowerCase();
  const shown = q ? all.filter(p => p.toLowerCase().includes(q)) : all;
  const count = s.playercount ?? all.length;
  el.innerHTML = `
    <div class="banner${bannerOf(s) ? " has-img" : ""}">${bannerOf(s) ? `<img src="${esc(bannerOf(s))}" alt="" onerror="this.parentNode.classList.remove('has-img');this.remove()">` : ""}</div>
    <div class="d-body">
      <div class="d-head">
        ${iconHtml(s, st)}
        <div>
          <h2>${esc(s.name || "Unnamed server")}</h2>
          <span class="status"><i class="dot ${st}"></i>${LABEL[st]}</span>
        </div>
      </div>
      <p class="desc">${esc(s.description || "This server has no description.")}</p>
      ${addrOf(s) ? `<div class="addr"><div><span>Server address</span><code>${esc(addrOf(s))}</code></div><button class="copy" type="button" data-copy="${esc(addrOf(s))}">Copy</button></div>` : ""}
      <div class="stats">
        <div class="stat"><span>Players online</span><strong>${esc(count)}</strong></div>
        <div class="stat"><span>Status</span><strong>${LABEL[st]}</strong></div>
        <div class="stat"><span>Last report</span><strong>${s.received ? ago(s.received) : "–"}</strong></div>
      </div>
      <h3>Players
        ${all.length > 6 ? `<input class="search" id="search" type="search" placeholder="Find a player" value="${esc(filter)}" aria-label="Find a player">` : ""}
      </h3>
      ${shown.length
        ? `<ul class="players">${shown.map(p => `<li><span title="${esc(p)}">${esc(p)}</span></li>`).join("")}</ul>`
        : `<div class="empty">${all.length ? "No players match that name." : "Nobody is online right now."}</div>`}
    </div>`;
  const input = $("search");
  if (input) input.addEventListener("input", e => { filter = e.target.value; const pos = e.target.selectionStart; renderDetail(); const n = $("search"); n.focus(); n.setSelectionRange(pos, pos); });
}

function renderSync(){
  $("updated").textContent = failed
    ? "Update failed" + (lastFetch ? " · last success " + ago(lastFetch) : "")
    : lastFetch ? "Updated " + ago(lastFetch) : "Loading…";
}

async function load(){
  const btn = $("refresh");
  btn.classList.add("spin");
  try {
    const res = await fetch(API, { cache: "no-store" });
    if (!res.ok) throw new Error("HTTP " + res.status);
    const prevName = servers[selected]?.name;
    servers = normalize(await res.json());
    const idx = servers.findIndex(s => s.name === prevName);
    selected = idx >= 0 ? idx : Math.min(selected, Math.max(servers.length - 1, 0));
    failed = false; lastFetch = Date.now();
  } catch (e) {
    console.error(e);
    failed = true;
  }
  btn.classList.remove("spin");
  renderList(); renderDetail(); renderSync();
}

$("list").addEventListener("click", e => {
  const b = e.target.closest(".srv");
  if (!b) return;
  selected = +b.dataset.i; filter = "";
  renderList(); renderDetail();
  if (matchMedia("(max-width:820px)").matches) $("detail").scrollIntoView({behavior:"smooth", block:"start"});
});
$("detail").addEventListener("click", async e => {
  const b = e.target.closest(".copy");
  if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = "Copied"; }
  catch { b.textContent = "Press Ctrl+C"; }
  setTimeout(() => { b.textContent = "Copy"; }, 1500);
});
$("refresh").addEventListener("click", load);
setInterval(load, REFRESH_MS);
setInterval(() => { renderSync(); }, 5000);
load();
</script>
</body>
</html>
